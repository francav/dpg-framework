name: deploy

# Publishes the site to GitHub Pages. The entire workflow is GATED behind the repo variable
# PUBLISH_SITE: it does nothing until PUBLISH_SITE is set to "true" AND GitHub Pages is enabled for
# the repo (Settings -> Pages -> Source: GitHub Actions). This keeps the deploy pipeline in place
# while the repo is still private and before a domain is chosen.
#
# The site build itself is verified on every push/PR by the `ci` workflow, so gating this off does
# not reduce build coverage. To go live: enable Pages, then set the PUBLISH_SITE repo variable to
# "true".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PUBLISH_SITE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # GATE: do not publish until the repo opts in.
    if: vars.PUBLISH_SITE == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
